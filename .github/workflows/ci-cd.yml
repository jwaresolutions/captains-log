name: CI/CD

on:
  push:
    branches: [main]

jobs:
  check:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json

      - name: Backend - Install & Type Check
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit

      - name: Frontend - Install, Type Check & Build
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build

  build-and-push:
    name: Build & Push Images
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jwaresolutions/captains-log-backend:latest
            ghcr.io/jwaresolutions/captains-log-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jwaresolutions/captains-log-web:latest
            ghcr.io/jwaresolutions/captains-log-web:${{ github.sha }}
          build-args: VITE_API_BASE_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
